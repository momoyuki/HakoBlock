name: Request to add a domain
description: Suggest a domain to add to the block list
title: "[Add domain]: "
labels: ["domain-request"]
body:
  - type: input
    id: domain
    attributes:
      label: Domain
      description: The bare domain, no protocol or path (e.g. ads.example.com)
      placeholder: ads.example.com
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - Thai ads (thai-ads.txt)
        - Gambling / betting (gambling.txt)
        - Tracker / analytics (tracker.txt)
        - Other (explain below)
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: Why should this be blocked?
      description: What does this domain serve, and how did you notice it (site where it appears, screenshot, etc.)
    validations:
      required: true

  - type: input
    id: evidence
    attributes:
      label: Evidence link (optional)
      description: A link to the site where this domain appears, or a screenshot
